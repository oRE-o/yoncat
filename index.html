<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sonagii_ — Creative Artist, Software Engineer, and Nerd Aesthetics enthusiast. Interactive poster portfolio." />
    <meta name="theme-color" content="#08080c" />
    <title>Sonagii_ — Interactive Poster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply the stored theme (default: dark) before first paint to avoid a flash.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('yoncat-theme');
        } catch (e) {}
        var theme = stored === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
